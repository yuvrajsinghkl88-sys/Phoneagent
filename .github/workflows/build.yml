name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project
        run: |
          echo '' | base64 -d > p.zip
          unzip -q p.zip
      - name: Build
        run: |
          cd PhoneAgent
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-apk
          path: PhoneAgent/app/build/outputs/apk/debug/app-debug.apk
