
name: Build Gemini PhoneAgent APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Gemini source ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/phoneagent"
          unzip -q "$GITHUB_WORKSPACE/PhoneAgent-StepByStep-Source.zip" \
            -d "$RUNNER_TEMP/phoneagent"

          PROJECT_FILE=$(find "$RUNNER_TEMP/phoneagent" \
            -name settings.gradle.kts \
            -o -name settings.gradle | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Gradle project not found in source ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" \
            >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug \
            --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not generated"
            exit 1
          fi

          mkdir -p artifact
          cp "$APK" artifact/PhoneAgent-Gemini-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-Gemini-APK
          path: artifact/PhoneAgent-Gemini-debug.apk
          if-no-files-found: error
        
